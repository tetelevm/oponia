[project]
name = "oponia-game"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi",
    "pillow>=12.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sqladmin[auth]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "ipython>=9.19.1",
]
